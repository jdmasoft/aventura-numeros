<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juego para aprender a sumar y restar con Dino: voz en español, pistas, estrellas y pegatinas.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Aventura de Números</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one centered play column over a living sky; big tactile tiles, mascot as guide. */
:root{
  --sky-top:#7cc8ff; --sky-bottom:#e3f5ff; --ink:#1d2756; --ink-soft:#4a5590;
  --card:#ffffff; --card-edge:#c9def5; --sun:#ffc531; --sun-deep:#f29d00;
  --coral:#ff6a4d; --grape:#7d55f0; --sea:#18b5a8; --leaf:#5cc542; --leaf-deep:#3c9a28;
  --cloud:#ffffff; --star-on:#ffbf1f; --star-off:#cdd6e8; --hint:#fff4d1; --shadow:rgba(29,39,86,.18);
  --f-display:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r-big:28px; --r-mid:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky-top:#0d1240; --sky-bottom:#2b2d78; --ink:#f2f4ff; --ink-soft:#b9c0f0;
  --card:#1f2462; --card-edge:#3a4196; --sun:#ffd04d; --sun-deep:#e8a000;
  --coral:#ff7d63; --grape:#a283ff; --sea:#2fd0c2; --leaf:#6fd654; --leaf-deep:#4cb032;
  --cloud:#3d4396; --star-on:#ffd04d; --star-off:#454b92; --hint:#3a3570; --shadow:rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sky-top:#0d1240; --sky-bottom:#2b2d78; --ink:#f2f4ff; --ink-soft:#b9c0f0;
  --card:#1f2462; --card-edge:#3a4196; --sun:#ffd04d; --sun-deep:#e8a000;
  --coral:#ff7d63; --grape:#a283ff; --sea:#2fd0c2; --leaf:#6fd654; --leaf-deep:#4cb032;
  --cloud:#3d4396; --star-on:#ffd04d; --star-off:#454b92; --hint:#3a3570; --shadow:rgba(0,0,0,.4);
  color-scheme:dark}

html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom) 70%);background-color:var(--sky-bottom);color:var(--ink);font-family:var(--f-body);font-size:17px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;background:var(--cloud);border-radius:999px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;top:-70%}
.cloud::after{width:40%;height:120%;left:50%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.hill{position:fixed;left:-10%;right:-10%;bottom:-60px;height:140px;background:var(--leaf);border-radius:50% 50% 0 0;z-index:0;opacity:.9}
.hill.b{background:var(--leaf-deep);bottom:-80px;left:30%;right:-30%;opacity:.8}

#app{position:relative;z-index:1;max-width:860px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:18px;flex:1;animation:pop-in .35s ease-out}
@keyframes pop-in{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.6rem,9vw,4.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,5.5vw,2.4rem);font-weight:800}
p{margin:0}

button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.btn{font-family:var(--f-display);font-weight:800;font-size:1.35rem;min-height:64px;padding:8px 26px;border-radius:999px;background:var(--sun);color:#3a2600;box-shadow:0 6px 0 var(--sun-deep),0 10px 20px var(--shadow);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sun-deep),0 4px 10px var(--shadow)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--card-edge),0 10px 20px var(--shadow)}
.btn.small{min-height:52px;font-size:1.1rem;padding:6px 18px}
.icon-btn{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--card-edge),0 6px 14px var(--shadow);font-size:1.6rem;display:grid;place-items:center;flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--card-edge)}

.card{background:var(--card);border-radius:var(--r-big);box-shadow:0 8px 0 var(--card-edge),0 14px 30px var(--shadow);padding:20px}

/* Mascot */
.dino{width:150px;height:150px;flex:none}
.dino.big{width:min(240px,55vw);height:auto}
.dino .body{transform-origin:50% 90%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.03) translateY(-2px)}}
.dino .eye{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.dino.happy .body{animation:dance .5s ease-in-out 3}
@keyframes dance{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(-14px)}75%{transform:rotate(8deg) translateY(-14px)}}
.dino.think .body{animation:tilt 1s ease-in-out 2}
@keyframes tilt{50%{transform:rotate(-6deg)}}
.dino .mouth-sad{display:none}
.dino.think .mouth-sad{display:block}.dino.think .mouth-happy{display:none}

.bubble{position:relative;background:var(--card);border-radius:var(--r-mid);padding:12px 18px;font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 var(--card-edge);min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--card);border-left:0}

/* Home */
.home{align-items:center;text-align:center;justify-content:center;gap:22px}
.home .eyebrow{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-size:.95rem}
.title-num{display:inline-block;margin-left:.2em;color:var(--coral);animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{50%{transform:rotate(-6deg) scale(1.08)}}
.name-row{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:420px}
.name-input{width:100%;box-sizing:border-box;font-family:var(--f-display);font-size:1.6rem;font-weight:700;text-align:center;padding:12px 18px;border-radius:999px;border:4px solid var(--card-edge);background:var(--card);color:var(--ink)}
.name-input::placeholder{color:var(--ink-soft);opacity:.7}

/* Map */
.topbar{display:flex;align-items:center;gap:12px}
.topbar .grow{flex:1;min-width:0}
.hello{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.1}
.total-stars{font-family:var(--f-display);font-weight:800;font-size:1.3rem;background:var(--card);border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 var(--card-edge);white-space:nowrap}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}
.world{position:relative;text-align:left;border-radius:var(--r-big);padding:18px;min-height:150px;display:flex;flex-direction:column;gap:6px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.18),0 14px 26px var(--shadow);overflow:hidden;transition:transform .15s}
.world:not(:disabled):hover{transform:translateY(-3px) rotate(-.5deg)}
.world:active{transform:translateY(4px)}
.world .w-emoji{font-size:3.2rem;line-height:1;position:absolute;right:14px;top:10px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.world .w-tag{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.world .w-name{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.05;max-width:75%}
.world .w-desc{font-weight:700;font-size:1rem;opacity:.95}
.world .w-stars{margin-top:auto;font-size:1.5rem;letter-spacing:2px}
.world:disabled{filter:grayscale(.8) brightness(.9);cursor:not-allowed}
.world .lock{position:absolute;right:14px;bottom:12px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:rgba(0,0,0,.3)}
.w1{background:linear-gradient(135deg,#ff7a59,#ff4f7b)}
.w2{background:linear-gradient(135deg,#1fb8c9,#2672e6)}
.w3{background:linear-gradient(135deg,#7d55f0,#3a2fa8)}
.w4{background:linear-gradient(135deg,#f6a21a,#d9541e)}
.w5{background:linear-gradient(135deg,#19b37a,#0b7d6a)}
.map-actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}

/* Game */
.progress{flex:1;display:flex;gap:6px;min-width:0}
.progress span{flex:1;height:14px;border-radius:999px;background:var(--star-off);transition:background .3s}
.progress span.done{background:var(--leaf)}
.progress span.miss{background:var(--sun)}
.progress span.now{background:var(--grape);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.timer{flex:1;height:18px;border-radius:999px;background:var(--star-off);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));transition:width 1s linear}
.guide{display:flex;align-items:center;gap:16px}
.guide .dino{width:96px;height:96px}
.scene{min-height:120px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px 4px;padding:14px;border-radius:var(--r-big);background:color-mix(in srgb,var(--card) 70%,transparent);border:3px dashed var(--card-edge)}
.scene:empty{display:none}
.obj{font-size:clamp(2rem,7vw,2.8rem);line-height:1;position:relative;display:inline-grid;place-items:center;width:1.25em;height:1.25em;animation:drop .4s cubic-bezier(.3,1.6,.5,1) both}
.obj.extra{filter:drop-shadow(0 0 6px var(--sun))}
.obj.gone{animation:swim-away 1s ease-in forwards}
.obj.gone-static{opacity:.25;filter:grayscale(1)}
.obj .count{position:absolute;top:-8px;right:-8px;background:var(--grape);color:#fff;font-family:var(--f-display);font-weight:800;font-size:.9rem;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;animation:pop-in .2s}
.sep{width:16px}
@keyframes drop{from{transform:translateY(-40px) scale(.3);opacity:0}}
@keyframes swim-away{to{transform:translateX(120px) translateY(-20px) rotate(15deg);opacity:.15}}

.equation{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,13vw,5.6rem);text-align:center;line-height:1;display:flex;justify-content:center;align-items:center;gap:.25em;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.equation .op{color:var(--coral)}
.equation .q{display:inline-grid;place-items:center;min-width:1.3em;padding:0 .15em;border-radius:20px;background:var(--card);box-shadow:0 6px 0 var(--card-edge);color:var(--grape)}
.equation .q.filled{color:var(--leaf-deep)}
.equation.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:520px){.choices{grid-template-columns:repeat(2,1fr)}}
.choice{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,8vw,3rem);min-height:92px;border-radius:50% 50% 46% 54%/55% 50% 50% 45%;color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18),0 8px 16px var(--shadow);transition:transform .12s;font-variant-numeric:tabular-nums;animation:float 3s ease-in-out infinite}
.choice:nth-child(1){background:var(--coral)}.choice:nth-child(2){background:var(--sea);animation-delay:-.7s}.choice:nth-child(3){background:var(--grape);animation-delay:-1.4s}.choice:nth-child(4){background:var(--sun-deep);animation-delay:-2.1s}
.choice:active{transform:scale(.92)}
.choice.wrong{opacity:.35;animation:none;transform:scale(.9)}
.choice.right{animation:boing .5s}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes boing{30%{transform:scale(1.2)}60%{transform:scale(.95)}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;width:100%;margin:0 auto}
.key{font-family:var(--f-display);font-weight:800;font-size:2rem;min-height:66px;border-radius:var(--r-mid);background:var(--card);box-shadow:0 6px 0 var(--card-edge);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(4px);box-shadow:0 2px 0 var(--card-edge)}
.key.ok{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-deep)}
.key.del{background:var(--hint)}

.hint{background:var(--hint);border-radius:var(--r-mid);padding:14px 18px;font-weight:800;font-size:1.15rem;text-align:center}
.hint svg{display:block;width:100%;height:auto;margin-top:8px}
.hint .nl-text{fill:var(--ink);font-family:var(--f-display);font-weight:700}

.rocket-lane{position:relative;height:110px;border-radius:var(--r-big);background:linear-gradient(0deg,var(--card),transparent);overflow:hidden}
.rocket{position:absolute;bottom:6px;font-size:3rem;transition:left .5s cubic-bezier(.3,1.4,.5,1);transform:rotate(45deg)}
.score-pill{font-family:var(--f-display);font-weight:800;font-size:1.4rem;background:var(--card);border-radius:999px;padding:4px 16px;box-shadow:0 4px 0 var(--card-edge);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Results */
.results{align-items:center;text-align:center;justify-content:center}
.big-stars{font-size:clamp(3.4rem,14vw,5rem);display:flex;gap:10px}
.big-stars span{animation:star-in .5s cubic-bezier(.3,1.7,.5,1) both}
.big-stars span.off{filter:grayscale(1);opacity:.3}
@keyframes star-in{from{transform:scale(0) rotate(-180deg)}}
.new-sticker{display:flex;align-items:center;gap:14px;text-align:left}
.new-sticker .s{font-size:4rem;animation:boing .8s .6s both}

/* Album */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.sticker{aspect-ratio:1;max-width:100%;border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--card-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:.95rem;padding:6px;text-align:center}
.sticker .s{font-size:3rem;line-height:1}
.sticker.locked .s{filter:brightness(0);opacity:.18}
.sticker.locked{color:var(--ink-soft)}

/* Mic */
.mic-row{display:flex;justify-content:center}
.mic-btn{display:inline-flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;min-height:64px;padding:8px 26px 8px 10px;border-radius:999px;background:var(--grape);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--grape) 60%,#000),0 10px 20px var(--shadow);transition:background .2s}
.mic-btn:active{transform:translateY(4px)}
.mic-ico{position:relative;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.6rem}
.mic-btn.on{background:var(--coral);box-shadow:0 6px 0 color-mix(in srgb,var(--coral) 60%,#000),0 10px 20px var(--shadow)}
.mic-btn.on .mic-ico::before,.mic-btn.on .mic-ico::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #fff;animation:ripple 1.2s ease-out infinite}
.mic-btn.on .mic-ico::after{animation-delay:.6s}
@keyframes ripple{to{transform:scale(1.9);opacity:0}}
/* Voice notice */
.voice-warn{display:flex;align-items:center;gap:12px;background:var(--hint);border-radius:var(--r-mid);padding:12px 16px;font-weight:800;text-align:left}
.voice-warn button{text-decoration:underline;font-weight:800;color:var(--grape)}
.help{display:flex;flex-direction:column;gap:12px}
.help h3{font-size:1.35rem}
.help dl{margin:0;display:grid;gap:10px}
.help dt{font-weight:800}
.help dd{margin:0;color:var(--ink-soft);font-weight:600;line-height:1.45}
/* Settings */
.settings{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.row label{font-weight:800;font-size:1.1rem}
.row small{display:block;font-weight:600;color:var(--ink-soft);font-size:.9rem}
.switch{width:68px;height:38px;border-radius:999px;background:var(--star-off);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 4px var(--shadow);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{transform:translateX(30px)}
select,input[type=range]{font:inherit;font-weight:700;max-width:100%}
select{padding:8px 12px;border-radius:14px;border:3px solid var(--card-edge);background:var(--card);color:var(--ink)}
.seg{display:flex;gap:6px;background:var(--star-off);padding:4px;border-radius:999px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px var(--shadow)}
.danger{color:var(--coral);font-weight:800;text-decoration:underline}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="sky" aria-hidden="true"></div>
<div class="hill" aria-hidden="true"></div><div class="hill b" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="live" class="sr" aria-live="polite"></div>
<main id="app"></main>

<script>
"use strict";
/* ---------- Storage (safe) ---------- */
const Store = (() => {
  const KEY = "aventura-numeros-v1";
  const blank = () => ({ name:"", stars:{}, stickers:[], best:0, settings:{ voice:true, rate:1, voiceName:"", mode:"auto", unlockAll:false, autoListen:false, micLang:"" } });
  let data = blank();
  try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); data = Object.assign(blank(), p); data.settings = Object.assign(blank().settings, p.settings||{}); } } catch(e) {}
  return {
    get d(){ return data; },
    save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} },
    reset(){ const keep = data.settings; data = blank(); data.settings = keep; this.save(); }
  };
})();

/* ---------- AudioUnlock (iPhone/iPad) ----------
   iOS solo deja sonar audio y voz si empiezan dentro de un toque, y el interruptor de
   silencio apaga Web Audio salvo que la página pida el modo "reproducción". En el primer
   toque se activa todo una sola vez. */
const AudioUnlock = (() => {
  let ctx = null, done = false;
  function getCtx(){

function genProblem(world, cap){
  let op, a, b, ans, missing=false;
  if (world === "w1") op = "+";
  else if (world === "w2") op = "-";
  else op = Math.random() < .5 ? "+" : "-";
  const lo = world === "w4" ? 5 : 1;
  if (op === "+") { a = rnd(lo, cap-1); b = rnd(1, cap-a); ans = a + b; }
  else { a = rnd(Math.max(2,lo), cap); b = rnd(1, a-1 >= 1 ? a-1 : 1); if (world==="w2"||world==="rush") b = rnd(1,a); ans = a - b; }
  if (world === "w4" && Math.random() < .45) missing = true;
  const p = { world, op, a, b, ans, missing, c: ans };
  if (missing) { p.c = ans; p.ans = b; }
  return p;
}
function makeChoices(ans, spread){
  const set = new Set([ans]); let guard = 0;
  const deltas = spread > 20 ? [1,-1,2,-2,10,-10,3,-3] : [1,-1,2,-2,3,-3];
  while (set.size < 4 && guard++ < 50) { const v = ans + deltas[rnd(0,deltas.length-1)]; if (v >= 0) set.add(v); }
  let n = ans + 4; while (set.size < 4) set.add(n++);
  return [...set].sort(()=>Math.random()-.5);
}

const Confetti = (() => {
  const cv = document.getElementById("confetti"), cx = cv.getContext("2d"); let parts = [], raf = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cols = ["#ff6a4d","#ffc531","#18b5a8","#7d55f0","#5cc542","#ff4f7b"];
  function burst(n=120){
    if (reduce) return;
    cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio;
    for (let i=0;i<n;i++) parts.push({ x:innerWidth/2+rnd(-60,60), y:innerHeight*.45, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, r:rnd(5,10), c:cols[i%cols.length], a:Math.random()*6, s:Math.random()*.3-.15, life:120 });
    if (!raf) loop();
  }
  function loop(){
    cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; p.life--; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight+20);
    raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,innerWidth,innerHeight), 0);
  }
  return { burst };
})();

    const p = genProblem(world.id, cap);
    let tries = 0;
    [...progress.children].forEach((s,k)=>{ s.className = k<i ? results[k] : k===i ? "now" : ""; });
    hintBox.hidden = true; mood("");
    const qSlot = h("span",{class:"q"},"?");
    eq.replaceChildren(...(p.missing
      ? [h("span",{},p.a), h("span",{class:"op"},p.op==="+"?"+":"−"), qSlot, h("span",{class:"op"},"="), h("span",{},p.c)]
      : [h("span",{},p.a), h("span",{class:"op"},p.op==="+"?"+":"−"), h("span",{},p.b), h("span",{class:"op"},"="), qSlot]));
    const spoken = speechFor(p, world.id);
    repeat.onclick = () => say(spoken, bubble);
    // Scene
    scene.replaceChildren();
    const objs = [];
    if (world.visual && !p.missing && p.a <= 20) {
      const obj = world.id === "w3" ? (p.op==="+"?"⭐":"🪐") : world.obj;
      for (let k=0;k<p.a;k++){ const o = h("span",{class:"obj",style:`animation-delay:${k*60}ms`},obj); objs.push(o); scene.append(o); }
      if (p.op === "+") {
        scene.append(h("span",{class:"sep"}));
        setTimeout(()=>{ if (session!==my) return; for (let k=0;k<p.b;k++){ const o = h("span",{class:"obj extra",style:`animation-delay:${k*90}ms`},obj); objs.push(o); scene.append(o); } Sound.pop(); }, 700 + p.a*60);
      } else {
        setTimeout(()=>{ if (session!==my) return; objs.slice(-p.b).forEach((o,k)=>{ o.style.animationDelay = k*120+"ms"; o.classList.add(world.id==="w2"?"gone":"gone-static"); }); Sound.pop(); }, 900 + p.a*60);
      }
    }
    const autoListen = () => { if (Store.d.settings.autoListen && session === my && mic.handlers === handlers && answerArea.style.pointerEvents !== "none") mic.listen(); };
    let autoMisses = 0;
    const handlers = {
      async onNumber(v){
        if (answerArea.style.pointerEvents === "none") return;
        const btn = [...answerArea.querySelectorAll(".choice")].find(b => +b.textContent === v && !b.disabled);
        qSlot.textContent = v;
        const ok = await check(v, btn);
        if (!ok && mic.handlers === handlers) { qSlot.textContent = "?"; }
      },
      onMiss(heard, error){
        say(missMessage(heard, error), bubble).then(() => { if (autoMisses++ < 1) autoListen(); });
      }
    };
    mic.handlers = handlers;
    say(spoken, bubble).then(autoListen);

    const mode = Store.d.settings.mode === "auto" ? world.mode : Store.d.settings.mode;
    const check = async (val, btn) => {
      if (session !== my) return false;
      if (val === p.ans) {
        qSlot.textContent = val; qSlot.classList.add("filled");
        btn?.classList.add("right");
        Sound.right(); Confetti.burst(70); mood("happy");
        if (tries === 0) { streak++; missStreak = 0; if (streak >= 3) { cap = Math.min(world.cap[1], cap + (world.id==="w4"?10:2)); streak = 0; } }
        results[i] = tries === 0 ? "done" : "miss";
        answerArea.style.pointerEvents = "none";
        await say(pickOne(PRAISE) + (tries===0 && Math.random()<.4 && Store.d.name ? ` ${Store.d.name}!` : ""), bubble);
        await sleep(350);
        answerArea.style.pointerEvents = "";
        i++; next(); return true;
      }
      tries++; mistakes++; streak = 0; missStreak++;
      if (missStreak >= 2) { cap = Math.max(world.cap[0], cap - (world.id==="w4"?10:2)); missStreak = 0; }
      Sound.oops(); mood("think");
      btn?.classList.add("wrong"); if (btn) btn.disabled = true;
      eq.classList.remove("shake"); void eq.offsetWidth; eq.classList.add("shake");
      if (tries >= 2) {
        qSlot.textContent = p.ans; qSlot.classList.add("filled");
        results[i] = "miss"; answerArea.style.pointerEvents = "none";
        await say(`La respuesta es ${p.ans}. ¡La próxima la sacas tú!`, bubble);
        await sleep(600); answerArea.style.pointerEvents = "";
        i++; next(); return false;
      }
      showHint(p, objs);
      return false;
    };

    if (mode === "choices") {
      answerArea.replaceChildren(h("div",{class:"choices"}, makeChoices(p.ans, cap).map(v => { const b = h("button",{class:"choice","aria-label":String(v)},String(v)); b.onclick = () => check(v, b); return b; })));
    } else {
      let typed = "";
      const upd = () => { qSlot.textContent = typed || "?"; };
      const key = (lbl, fn, cls="key") => h("button",{class:cls,"aria-label":lbl==="⌫"?"Borrar":lbl==="✓"?"Comprobar":lbl,onclick:()=>{Sound.tap();fn();}},lbl);
      const pad = h("div",{class:"pad"},
        [1,2,3,4,5,6,7,8,9].map(n=>key(String(n),()=>{ if (typed.length<3){typed+=n;upd();} })),
        key("⌫",()=>{typed=typed.slice(0,-1);upd();},"key del"),
        key("0",()=>{ if (typed.length<3 && typed!=="0"){typed+="0";upd();} }),
        key("✓",async()=>{ if(!typed) return; const ok = await check(+typed); if(!ok){ typed=""; if(session===my && i<ROUNDS) upd(); } },"key ok"));
      answerArea.replaceChildren(pad);
      document.onkeydown = e => {
        if (session !== my) { document.onkeydown = null; return; }
        if (/^[0-9]$/.test(e.key)) { const b=[...pad.children].find(b=>b.textContent===e.key); b?.click(); }
        else if (e.key==="Backspace") pad.children[9].click();
        else if (e.key==="Enter") pad.children[11].click();
      };
    }
  }

  async function showHint(p, objs){
    hintBox.hidden = false;
    if (objs.length && !p.missing) {
      const keep = p.op === "+" ? objs : objs.slice(0, p.a - p.b);
      hintBox.replaceChildren(p.op==="+" ? "Cuenta todas las cosas conmigo 👆" : "Cuenta las que se quedaron 👆");
      const words = keep.map((_,k)=>k+1).join(", ");
      say(pickOne(OOPS), bubble).then(()=>{
        if (session!==my) return;
        Voice.speak("Contemos juntos: " + words);
        keep.forEach((o,k)=>setTimeout(()=>{ if(session!==my) return; o.querySelector(".count")?.remove(); o.append(h("span",{class:"count"},k+1)); }, 900 + k*480));
      });
    } else if (p.missing) {
      const txt = p.op === "+" ? `Empieza en ${p.a} y cuenta hasta llegar a ${p.c}.` : `Desde ${p.a}, ¿cuánto quitas para llegar a ${p.c}?`;
      hintBox.replaceChildren(txt); say(pickOne(OOPS) + " " + txt, bubble);
    } else if (p.a + p.b > 20 || p.a > 20) {
      const tens = Math.floor(p.b/10)*10, ones = p.b - tens;
      const step1 = p.op==="+" ? p.a + tens : p.a - tens;
      const txt = tens && ones ? `Truco: primero ${p.op==="+"?"suma":"resta"} ${tens}: ${p.a} ${p.op==="+"?"+":"−"} ${tens} = ${step1}. Luego ${p.op==="+"?"suma":"resta"} ${ones}.` : `Truco: cuenta de ${p.op==="+"?"uno en uno hacia arriba":"uno en uno hacia abajo"} desde ${p.a}.`;
      hintBox.replaceChildren(txt); say(pickOne(OOPS) + " " + txt, bubble);
    } else {
      hintBox.replaceChildren(`Salta en la recta numérica desde ${p.a}`, numberLine(p));
      say(pickOne(OOPS) + ` Empieza en el ${p.a} y salta ${p.b} ${p.b===1?"vez":"veces"} hacia ${p.op==="+"?"adelante":"atrás"}.`, bubble);
    }
  }
  next();
}

function numberLine(p){
  const max = Math.max(10, p.op==="+" ? p.a+p.b : p.a);
  const W = 640, pad = 24, step = (W - pad*2)/max;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} 90`); svg.setAttribute("role","img"); svg.setAttribute("aria-label","Recta numérica");
  const mk = (t,a) => { const e = document.createElementNS(NS,t); for (const k in a) e.setAttribute(k,a[k]); svg.append(e); return e; };
  mk("line",{x1:pad,y1:60,x2:W-pad,y2:60,stroke:"currentColor","stroke-width":3});
  for (let n=0;n<=max;n++){ const x = pad+n*step; mk("line",{x1:x,y1:54,x2:x,y2:66,stroke:"currentColor","stroke-width":2}); const t = mk("text",{x,y:84,"text-anchor":"middle","font-size":max>12?12:15,class:"nl-text"}); t.textContent = n; }
  const dir = p.op==="+"?1:-1;
  for (let k=0;k<p.b;k++){ const x1 = pad+(p.a+dir*k)*step, x2 = pad+(p.a+dir*(k+1))*step; const path = mk("path",{d:`M${x1} 54 Q${(x1+x2)/2} ${18} ${x2} 54`,fill:"none",stroke:"#7d55f0","stroke-width":3,"stroke-dasharray":"200","stroke-dashoffset":"200"}); path.style.transition=`stroke-dashoffset .4s ${k*.45}s`; requestAnimationFrame(()=>requestAnimationFrame(()=>path.setAttribute("stroke-dashoffset","0"))); }
  mk("circle",{cx:pad+p.a*step,cy:60,r:8,fill:"#ff6a4d"});
  return svg;
}

function Results(world, mistakes){
  const stars = mistakes <= 1 ? 3 : mistakes <= 3 ? 2 : 1;
  const prev = starsFor(world.id);
  if (stars > prev) Store.d.stars[world.id] = stars;
  let sticker = null;
  if (stars >= 2 && Store.d.stickers.length < STICKERS.length) {
    const free = STICKERS.map((_,k)=>k).filter(k=>!Store.d.stickers.includes(k));
    sticker = free[rnd(0,free.length-1)]; Store.d.stickers.push(sticker);
  }
  Store.save();
  const nm = Store.d.name;
  const msg = stars === 3 ? `¡Perfecto${nm?", "+nm:""}! Tres estrellas.` : stars === 2 ? `¡Muy bien${nm?", "+nm:""}! Ganaste dos estrellas.` : `¡Buen trabajo! Ganaste una estrella. Practica otra vez para ganar más.`;
  show(h("section",{class:"screen results"},
    dino("big happy"),
    h("h2",{},stars===3?"¡Lo hiciste perfecto!":stars===2?"¡Muy bien!":"¡Buen trabajo!"),
    h("div",{class:"big-stars","aria-label":`${stars} de 3 estrellas`}, [0,1,2].map(k=>h("span",{class:k<stars?"":"off",style:`animation-delay:${.2+k*.25}s`},"⭐"))),
    sticker!=null ? h("div",{class:"card new-sticker"}, h("span",{class:"s"},STICKERS[sticker][0]), h("div",{}, h("strong",{style:"font-family:var(--f-display);font-size:1.4rem"},"¡Pegatina nueva!"), h("p",{},`Ganaste: ${STICKERS[sticker][1]}`))) : null,
    h("div",{class:"map-actions"}, h("button",{class:"btn",onclick:()=>Game(world)},"🔁 Jugar otra vez"), h("button",{class:"btn alt",onclick:WorldMap},"🗺️ Al mapa"))
  ));
  Sound.win(); Confetti.burst(180);
  Voice.speak(msg + (sticker!=null ? ` ¡Y ganaste la pegatina ${STICKERS[sticker][1]}!` : ""));
}

function Rush(){
  const my = session + 1;
  let score = 0, left = 60, timerId;
  const bar = h("i",{style:"width:100%"});
  const pill = h("span",{class:"score-pill"},"🚀 0");
  const rocket = h("span",{class:"rocket",style:"left:4%"},"🚀");
  const eq = h("div",{class:"equation"});
  const area = h("div");

  show(h("section",{class:"screen"},
    h("div",{class:"topbar"}, h("button",{class:"icon-btn","aria-label":"Volver al mapa",onclick:()=>{clearInterval(timerId);WorldMap();}},"🗺️"), h("div",{class:"timer","aria-label":"Tiempo"},bar), pill),
    h("div",{class:"rocket-lane"}, rocket),
    eq, micRow, area));
  eq.replaceChildren(h("span",{style:"font-size:.5em"},"¿Listo?"));
  area.replaceChildren(h("div",{class:"map-actions"},startBtn));
  Voice.speak(`¡Reto rápido! Tienes un minuto para resolver todas las que puedas. Récord actual: ${Store.d.best}.`);
  startBtn.onclick = () => {
    Sound.right();
    timerId = setInterval(()=>{ if (session!==my) return clearInterval(timerId); left--; bar.style.width = (left/60*100)+"%"; if (left<=10 && left>0) Sound.tap(); if (left<=0){ clearInterval(timerId); end(); } },1000);
    ask();
  };
  function ask(){
    if (session!==my || left<=0) return;
    const p = genProblem("rush", 10);
    const q = h("span",{class:"q"},"?");
    eq.replaceChildren(h("span",{},p.a), h("span",{class:"op"},p.op==="+"?"+":"−"), h("span",{},p.b), h("span",{class:"op"},"="), q);
    micRow.hidden = false;
    let answered = false;
    const answer = (v, b) => {
      if (left<=0 || answered) return;
      if (v===p.ans){ answered = true; score++; pill.textContent=`🚀 ${score}`; rocket.style.left = Math.min(86, 4+score*4)+"%"; Sound.right(); q.textContent=v; q.classList.add("filled"); setTimeout(ask,350); }
      else { Sound.oops(); if (b) { b.classList.add("wrong"); b.disabled = true; } if (Store.d.settings.autoListen) setTimeout(()=>{ if(!answered) mic.listen(); }, 500); }
    };
    const handlers = {
      onNumber(v){ answer(v, [...area.querySelectorAll(".choice")].find(b => +b.textContent === v && !b.disabled)); },
      onMiss(){ if (Store.d.settings.autoListen && !answered && left > 0) mic.listen(); }
    };
    mic.handlers = handlers;
    Voice.speak(speechFor(p,"rush")).then(()=>{ if (Store.d.settings.autoListen && session===my && mic.handlers===handlers && !answered && left>0) mic.listen(); });
    area.replaceChildren(h("div",{class:"choices"}, makeChoices(p.ans,10).map(v=>{ const b=h("button",{class:"choice"},String(v)); b.onclick=()=>answer(v,b); return b; })));
  }
  function end(){
    const record = score > Store.d.best; if (record) { Store.d.best = score; Store.save(); }
    Sound.win(); Confetti.burst(record?220:100);
    eq.replaceChildren(h("span",{style:"font-size:.55em"},`¡${score} correctas!`));
    area.replaceChildren(h("div",{class:"map-actions"}, h("button",{class:"btn",onclick:Rush},"🔁 Otra vez"), h("button",{class:"btn alt",onclick:WorldMap},"🗺️ Al mapa")));
    Voice.speak(record ? `¡Nuevo récord! Resolviste ${score}. ¡Eres un cohete!` : `¡Tiempo! Resolviste ${score}. Tu récord es ${Store.d.best}.`);
  }
}

}

      h("div",{class:"row"}, h("label",{for:"voice-sel"},"Voz en español", status), voiceSel),

  if (scrollToHelp) help.scrollIntoView({behavior:"smooth"});
